name: Generar embeddings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar embedder (chunks.json → embeddings)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -u embedder.py

      - name: Commit y push embeddings
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add embeddings.npy meta.json
          git diff --cached --quiet || git commit -m "Update embeddings"
          git push
