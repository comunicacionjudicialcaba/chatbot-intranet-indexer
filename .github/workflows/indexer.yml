name: 1- Indexar Drive y actualizar data.json

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # todos los días 03:00 UTC

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar indexer (Drive → data.json)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python -u indexer.py

      - name: Generar chunks (data.json → chunks.json)
        run: |
          python -u chunker.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json chunks.json
          git diff --cached --quiet || git commit -m "Auto update data.json + chunks.json"
          git push
