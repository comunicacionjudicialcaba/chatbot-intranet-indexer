<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Chatbot Intranet</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; }
    .user { color: #006; margin-top: 10px; }
    .bot { color: #060; margin-top: 10px; }
  </style>
</head>
<body>

<h2>💬 Chat Intranet</h2>

<div id="chat"></div>

<input id="msg" type="text" style="width:80%" placeholder="Escribí tu pregunta..." />
<button onclick="send()">Enviar</button>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("msg");

function add(text, cls){
  const d = document.createElement("div");
  d.className = cls;
  d.innerHTML = text;   // 👈 permite HTML (links clickeables)
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function send(){
  const text = input.value.trim();
  if(!text) return;

  add("👤 " + text, "user");
  input.value = "";

  fetch("/chat",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ question: text })
  })
  .then(r => r.json())
  .then(data => {
    console.log("RESPUESTA BACKEND:", data);
    add("🤖 " + (data.answer || "Sin respuesta"), "bot");
  })
  .catch(err => {
    console.error(err);
    add("❌ Error al consultar el servidor", "bot");
  });
}

input.addEventListener("keydown", e=>{
  if(e.key === "Enter") send();
});
</script>

</body>
</html>
