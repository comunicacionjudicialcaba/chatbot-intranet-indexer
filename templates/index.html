<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Chatbot Intranet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f6f6f6;
    }
    #box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 900px;
      margin: auto;
    }
    #question {
      width: 75%;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      margin-left: 8px;
      cursor: pointer;
    }
    #chat {
      margin-top: 25px;
    }
    .message {
      margin-bottom: 12px;
      padding: 10px;
      border-radius: 6px;
    }
    .user {
      background: #e3f2fd;
    }
    .bot {
      background: #e8f5e9;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div id="box">
  <h2>Buscador y Chat — Intranet</h2>

  <input id="question" type="text" placeholder="Escribí tu pregunta..." />
  <button onclick="ask()">Buscar</button>

  <div id="chat"></div>
</div>

<script>
function ask() {
  const input = document.getElementById("question");
  const q = input.value.trim();
  if (!q) return;

  const chat = document.getElementById("chat");

  chat.innerHTML += `<div class="message user"><b>Pregunta:</b> ${q}</div>`;

  fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: q })
  })
  .then(r => r.json())
  .then(res => {
    chat.innerHTML += `<div class="message bot"><b>Bot:</b> ${res.answer}</div>`;
    input.value = "";
  })
  .catch(err => {
    console.error(err);
    chat.innerHTML += `<div class="message bot">Error al consultar el servidor.</div>`;
  });
}
</script>

</body>
</html>
