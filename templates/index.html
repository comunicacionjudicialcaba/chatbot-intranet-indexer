<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Intranet – Buscador y Chatbot</title>
  <style>
    body { font-family: Arial; background:#f6f6f6; padding:30px; }
    #box { background:white; padding:20px; border-radius:8px; max-width:1000px; margin:auto; }

    h2 { margin-top:30px; }

    input { padding:10px; width:70%; font-size:16px; }
    button { padding:10px 14px; font-size:16px; cursor:pointer; }

    .result { margin:12px 0; }
    .result a { font-weight:bold; text-decoration:none; color:#1a0dab; }
    .meta { color:#555; font-size:13px; }

    .message { margin:10px 0; padding:10px; border-radius:6px; }
    .user { background:#e3f2fd; }
    .bot { background:#e8f5e9; white-space:pre-wrap; }
  </style>
</head>

<body>
<div id="box">

<!-- ================= BUSCADOR ================= -->

<h2>🔍 Buscador de notas</h2>

<input id="searchq" placeholder="Buscar por palabras clave...">
<button onclick="search()">Buscar</button>

<div id="results"></div>

<!-- ================= CHAT ================= -->

<h2>💬 Chatbot</h2>

<input id="question" placeholder="Hacé una pregunta en lenguaje natural...">
<button onclick="ask()">Preguntar</button>

<div id="chat"></div>

</div>

<script>
// -------- BUSCADOR --------

function search(){
  const q = document.getElementById("searchq").value.trim();
  if(!q) return;

  fetch(`/search?q=${encodeURIComponent(q)}`)
    .then(r => r.json())
    .then(data => {
      const box = document.getElementById("results");
      box.innerHTML = "";

      if(!data.length){
        box.innerHTML = "<p>No se encontraron resultados.</p>";
        return;
      }

      data.forEach(n => {
        box.innerHTML += `
          <div class="result">
            <a href="${n.url}" target="_blank">${n.titulo}</a>
            <div class="meta">${n.fecha} · ${n.seccion || ""} · ${n.autor || ""}</div>
          </div>
        `;
      });
    });
}

// -------- CHAT --------

function ask(){
  const input = document.getElementById("question");
  const q = input.value.trim();
  if(!q) return;

  const chat = document.getElementById("chat");
  chat.innerHTML += `<div class="message user"><b>Vos:</b> ${q}</div>`;

  fetch("/chat",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ question:q })
  })
  .then(r=>r.json())
  .then(res=>{
    chat.innerHTML += `<div class="message bot"><b>Bot:</b> ${res.answer}</div>`;
    input.value="";
  });
}
</script>

</body>
</html>
