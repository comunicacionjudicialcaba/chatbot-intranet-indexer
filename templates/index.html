<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Chatbot Intranet</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f2f4f7;
}

/* ===== LAYOUT ===== */
#layout{
  display:grid;
  grid-template-columns: 38% 62%;
  gap:15px;
  padding:15px;
  height:100vh;
  box-sizing:border-box;
}

.panel{
  background:#fff;
  border-radius:14px;
  padding:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  display:flex;
  flex-direction:column;
  min-height:0; /* CLAVE PARA SCROLL */
}

/* ===== BUSCADOR ===== */
#searchBox input, #searchBox select{
  padding:6px;
  margin-right:4px;
}

#results{
  margin-top:10px;
  overflow-y:auto;
  flex:1;
  border-top:1px solid #eee;
  padding-top:8px;
}

mark{
  background:#ffe08a;
  padding:0 2px;
}

/* ===== CHAT ===== */
#chat{
  flex:1;
  border:1px solid #ccc;
  padding:10px;
  overflow-y:auto;
  background:#fff;
  border-radius:8px;
}

.user{ color:#003; margin:8px 0; }
.bot{ color:#060; margin:8px 0; border-bottom:1px dashed #ddd; padding-bottom:8px }

#typing{ font-style:italic; color:#888; }

.bot button{ font-size:12px; margin-right:6px; margin-top:5px }

/* ===== FEEDBACK ===== */
.star{ cursor:pointer; font-size:18px; color:#ccc }
.star.selected{ color:gold }

.feedbackBox{
  margin-top:6px;
  background:#f2f2f2;
  padding:6px;
  border-radius:6px
}
</style>
</head>

<body>

<div id="layout">

  <!-- ================= BUSCADOR ================= -->
  <div class="panel">

    <h3>🔍 Buscador de notas</h3>

    <div id="searchBox">
      <input id="searchText" placeholder="Buscar por palabra…" style="width:55%">
      <select id="yearFilter"><option value="">Todos los años</option></select>
      <button onclick="runSearch()">Buscar</button>
    </div>

    <div id="results"></div>

  </div>

  <!-- ================= CHAT ================= -->
  <div class="panel">

    <h3>💬 Chat Intranet</h3>

    <div id="chat"></div>
    <div id="typing" style="display:none;">🤖 Escribiendo…</div>

    <div style="margin-top:8px">
      <input id="msg" style="width:78%" placeholder="Escribí tu pregunta…" />
      <button onclick="send()">Enviar</button>
    </div>

  </div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("msg");
const typing = document.getElementById("typing");
const resultsBox = document.getElementById("results");
const yearFilter = document.getElementById("yearFilter");

let ALL_DATA = [];

/* ================= LOAD DATA ================= */
fetch("/data")
.then(r=>r.json())
.then(data=>{
  ALL_DATA = data;
  const years = [...new Set(data.map(d=>d.anio).filter(Boolean))].sort((a,b)=>b-a);
  years.forEach(y=>{
    const opt=document.createElement("option");
    opt.value=y;
    opt.textContent=y;
    yearFilter.appendChild(opt);
  });
});

/* ================= HELPERS ================= */
function previewText(txt){
  if(!txt) return "";
  return txt.replace(/\s+/g," ").slice(0,220)+"...";
}

function highlight(text,q){
  if(!q) return text;
  const re=new RegExp(`(${q})`,"gi");
  return text.replace(re,"<mark>$1</mark>");
}

/* ================= SEARCH ================= */
function runSearch(){
  const q=document.getElementById("searchText").value.toLowerCase().trim();
  const year=yearFilter.value;
  resultsBox.innerHTML="";

  if(!q){
    resultsBox.innerHTML="<i>Escribí una palabra para buscar</i>";
    return;
  }

  let res=ALL_DATA.filter(d=>{
    if(year && String(d.anio)!==year) return false;
    const text=(d.titulo+" "+d.texto).toLowerCase();
    return text.includes(q);
  });

  res.sort((a,b)=>{
    if(!a.fecha_iso || !b.fecha_iso) return 0;
    return b.fecha_iso.localeCompare(a.fecha_iso);
  });

  if(!res.length){
    resultsBox.innerHTML="<i>No hay resultados</i>";
    return;
  }

  res.slice(0,80).forEach(d=>{
    const div=document.createElement("div");
    const title=highlight(d.titulo||"",q);
    const prev=highlight(previewText(d.texto||""),q);

    div.innerHTML=`
      <b>${title}</b><br>
      <small>${d.fecha||""}</small><br>
      <div style="color:#555;font-size:13px;margin:4px 0">${prev}</div>
      <a href="${d.url}" target="_blank">Abrir nota</a>
      <hr>
    `;
    resultsBox.appendChild(div);
  });

  input.focus();
}

/* ================= CHAT UI ================= */
function addUser(text){
  const d=document.createElement("div");
  d.className="user";
  d.textContent="👤 "+text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function addBot(html,question){
  const wrap=document.createElement("div");
  wrap.className="bot";

  const content=document.createElement("div");
  content.innerHTML="🤖 "+html;

  const copyBtn=document.createElement("button");
  copyBtn.textContent="📋 Copiar";
  copyBtn.onclick=()=>copyFormatted(content);

  const fbBox=buildFeedback(question,content.innerText);

  wrap.appendChild(content);
  wrap.appendChild(copyBtn);
  wrap.appendChild(fbBox);
  chat.appendChild(wrap);
  chat.scrollTop=chat.scrollHeight;
}

/* ================= COPY ================= */
function copyFormatted(el){
  const clone=el.cloneNode(true);
  clone.querySelectorAll("a").forEach(a=>{
    a.replaceWith(`${a.textContent}: ${a.href}`);
  });
  const txt=clone.innerText.replace(/^🤖 /,"").trim();
  navigator.clipboard.writeText(txt).then(()=>alert("Copiado"));
}

/* ================= FEEDBACK ================= */
function buildFeedback(question,answer){
  const box=document.createElement("div");
  box.className="feedbackBox";
  let rating=0;

  const stars=document.createElement("div");
  for(let i=1;i<=5;i++){
    const s=document.createElement("span");
    s.textContent="★";
    s.className="star";
    s.onclick=()=>{
      rating=i;
      stars.querySelectorAll(".star").forEach((x,j)=>{
        x.classList.toggle("selected",j<i);
      });
    };
    stars.appendChild(s);
  }

  const txt=document.createElement("textarea");
  txt.placeholder="Comentario (opcional)";
  txt.style.width="100%";

  const btn=document.createElement("button");
  btn.textContent="Enviar feedback";
  btn.onclick=()=>{
    fetch("/feedback",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({question,answer,rating,comment:txt.value})
    }).then(()=>btn.textContent="Gracias 🙌");
  };

  box.append("Valoración: ",stars,document.createElement("br"),txt,btn);
  return box;
}

/* ================= CHAT BACKEND ================= */
function send(){
  const text=input.value.trim();
  if(!text) return;

  addUser(text);
  input.value="";
  typing.style.display="block";

  fetch("/chat",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({question:text})
  })
  .then(r=>r.json())
  .then(d=>{
    typing.style.display="none";
    addBot(d.answer||"Sin respuesta",text);
  })
  .catch(()=>{
    typing.style.display="none";
    addBot("❌ Error de servidor",text);
  });
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});
</script>

</body>
</html>
