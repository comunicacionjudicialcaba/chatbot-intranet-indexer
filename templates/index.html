<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Chatbot Intranet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f6f6f6;
    }

    h2 {
      margin-bottom: 10px;
    }

    #chat {
      border: 1px solid #ccc;
      background: #fff;
      padding: 10px;
      height: 420px;
      overflow-y: auto;
      margin-bottom: 10px;
      border-radius: 6px;
    }

    .user {
      color: #003366;
      margin-top: 10px;
      white-space: pre-wrap;
    }

    .bot {
      color: #1b5e20;
      margin-top: 10px;
      white-space: pre-wrap;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    #msg {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }

    button {
      padding: 8px 14px;
      cursor: pointer;
    }

    a {
      color: #0b5ed7;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<h2>💬 Chat Intranet</h2>

<div id="chat"></div>

<div class="input-row">
  <input id="msg" type="text" placeholder="Escribí tu pregunta..." />
  <button onclick="send()">Enviar</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("msg");

function add(text, cls){
  const d = document.createElement("div");
  d.className = cls;
  d.innerHTML = text;   // ✅ permite links HTML
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function send(){
  const text = input.value.trim();
  if(!text) return;

  add("👤 " + text, "user");
  input.value = "";

  fetch("/chat",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ question: text })
  })
  .then(r => r.json())
  .then(data => {
    console.log("RESPUESTA BACKEND:", data);
    add("🤖 " + (data.answer || "Sin respuesta"), "bot");
  })
  .catch(err => {
    console.error(err);
    add("❌ Error al consultar el servidor", "bot");
  });
}

input.addEventListener("keydown", e=>{
  if(e.key === "Enter") send();
});
</script>

</body>
</html>
