<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Chatbot Intranet</title>

<style>
body { font-family: Arial, sans-serif; margin:20px; background:#f7f7f7; }
h2 { margin-top:0 }

#searchBox, #chatBox { background:#fff; padding:10px; border-radius:8px; margin-bottom:15px; }

#results { max-height:220px; overflow:auto; border:1px solid #ccc; padding:8px; background:#fff; }

#chat { border:1px solid #ccc; padding:10px; height:320px; overflow-y:auto; background:#fff; }

.user { color:#003; margin:8px 0; }
.bot { color:#060; margin:8px 0; border-bottom:1px dashed #ddd; padding-bottom:8px; }

.bot button { font-size:12px; margin-right:6px; margin-top:5px }

#typing { font-style:italic; color:#888; }

.star { cursor:pointer; font-size:18px; color:#ccc; }
.star.selected { color:gold; }

.feedbackBox { margin-top:6px; background:#f2f2f2; padding:6px; border-radius:6px }
</style>
</head>

<body>

<h2>🔍 Buscador de notas</h2>

<div id="searchBox">
  <input id="searchText" placeholder="Buscar por palabra…" style="width:60%">
  <select id="yearFilter"><option value="">Todos los años</option></select>
  <button onclick="runSearch()">Buscar</button>
  <div id="results"></div>
</div>

<h2>💬 Chat Intranet</h2>

<div id="chatBox">
  <div id="chat"></div>
  <div id="typing" style="display:none;">🤖 Escribiendo…</div>

  <input id="msg" style="width:75%" placeholder="Escribí tu pregunta…" />
  <button onclick="send()">Enviar</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("msg");
const typing = document.getElementById("typing");
const resultsBox = document.getElementById("results");
const yearFilter = document.getElementById("yearFilter");

let ALL_DATA = [];

/* =======================
   LOAD DATA + YEARS
======================= */
fetch("/data")
.then(r=>r.json())
.then(data=>{
  ALL_DATA = data;
  const years = [...new Set(data.map(d=>d.anio).filter(Boolean))].sort((a,b)=>b-a);
  years.forEach(y=>{
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    yearFilter.appendChild(opt);
  });
});

/* =======================
   SEARCH
======================= */
function runSearch(){
  const q = document.getElementById("searchText").value.toLowerCase();
  const year = yearFilter.value;

  resultsBox.innerHTML = "";

  const res = ALL_DATA.filter(d=>{
    if(year && String(d.anio)!==year) return false;
    const text = (d.titulo + " " + d.texto).toLowerCase();
    return q && text.includes(q);
  });

  if(!res.length){
    resultsBox.innerHTML = "<i>No hay resultados</i>";
    return;
  }

  res.slice(0,50).forEach(d=>{
    const div = document.createElement("div");
    div.innerHTML = `
      <b>${d.titulo}</b><br>
      ${d.fecha || ""}<br>
      <a href="${d.url}" target="_blank">Abrir nota</a>
      <hr>
    `;
    resultsBox.appendChild(div);
  });
}

/* =======================
   CHAT UI
======================= */
function addUser(text){
  const d = document.createElement("div");
  d.className="user";
  d.textContent="👤 "+text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function addBot(html, question){
  const wrap = document.createElement("div");
  wrap.className="bot";

  const content = document.createElement("div");
  content.innerHTML="🤖 "+html;

  const copyBtn = document.createElement("button");
  copyBtn.textContent="📋 Copiar";
  copyBtn.onclick=()=>copyFormatted(content);

  const fbBox = buildFeedback(question, content.innerText);

  wrap.appendChild(content);
  wrap.appendChild(copyBtn);
  wrap.appendChild(fbBox);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

/* =======================
   COPY CLEAN TEXT
======================= */
function copyFormatted(el){
  const clone = el.cloneNode(true);
  clone.querySelectorAll("a").forEach(a=>{
    a.replaceWith(`${a.textContent}: ${a.href}`);
  });
  const txt = clone.innerText.replace(/^🤖 /,"").trim();
  navigator.clipboard.writeText(txt).then(()=>alert("Copiado"));
}

/* =======================
   FEEDBACK UI + SEND
======================= */
function buildFeedback(question, answer){
  const box = document.createElement("div");
  box.className="feedbackBox";

  let rating = 0;

  const stars = document.createElement("div");
  for(let i=1;i<=5;i++){
    const s=document.createElement("span");
    s.textContent="★";
    s.className="star";
    s.onclick=()=>{
      rating=i;
      stars.querySelectorAll(".star").forEach((x,j)=>{
        x.classList.toggle("selected", j<i);
      });
    };
    stars.appendChild(s);
  }

  const txt = document.createElement("textarea");
  txt.placeholder="Comentario (opcional)";
  txt.style.width="100%";

  const btn = document.createElement("button");
  btn.textContent="Enviar feedback";
  btn.onclick=()=>{
    fetch("/feedback",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        question, answer, rating, comment:txt.value
      })
    }).then(()=>btn.textContent="Gracias 🙌");
  };

  box.append("Valoración: ",stars,document.createElement("br"),txt,btn);
  return box;
}

/* =======================
   CHAT BACKEND
======================= */
function send(){
  const text=input.value.trim();
  if(!text) return;

  addUser(text);
  input.value="";
  typing.style.display="block";

  fetch("/chat",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({question:text})
  })
  .then(r=>r.json())
  .then(d=>{
    typing.style.display="none";
    addBot(d.answer||"Sin respuesta", text);
  })
  .catch(()=>{
    typing.style.display="none";
    addBot("❌ Error de servidor", text);
  });
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});
</script>

</body>
</html>
