<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chatbot Intranet</title>

<style>
body { font-family: Arial, sans-serif; margin: 20px; }
input, select, button { padding: 6px; margin: 4px; }
.result { border-bottom: 1px solid #ddd; padding: 8px 0; }
.result a { display: block; color: #0066cc; }
.message { margin: 6px 0; }
.user { font-weight: bold; }
.bot { color: #333; background: #f4f4f4; padding: 6px; }
</style>

<script>
function toggleSeccion(){
  const tipo = document.getElementById("tipo").value;
  document.getElementById("seccion").style.display =
    tipo === "Artículo" ? "inline" : "none";
}

// ================= BUSCADOR =================
function search(){
  const q = document.getElementById("searchq").value.trim();
  const year = document.getElementById("year").value;
  const tipo = document.getElementById("tipo").value;
  const seccion = document.getElementById("seccion").value;

  fetch(`/search?q=${encodeURIComponent(q)}&year=${year}&tipo=${tipo}&seccion=${seccion}`)
    .then(r => r.json())
    .then(data => {
      const box = document.getElementById("results");
      box.innerHTML = "";

      if (!data.length){
        box.innerHTML = "<p>No se encontraron resultados.</p>";
        return;
      }

      data.forEach(n => {
        box.innerHTML += `
          <div class="result">
            <strong>${n.titulo}</strong><br>
            <small>${n.fecha} · ${n.tipo}${n.seccion ? " · " + n.seccion : ""}</small><br>
            <a href="${n.url}" target="_blank">Ver nota</a>
          </div>
        `;
      });
    });
}

// ================= CHAT =================
function ask(){
  const q = document.getElementById("question").value.trim();
  if (!q) return;

  const chat = document.getElementById("chat");
  chat.innerHTML += `<div class="message user">Vos: ${q}</div>`;

  fetch("/chat",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ question: q })
  })
  .then(r=>r.json())
  .then(res=>{
    chat.innerHTML += `<div class="message bot">${res.answer}</div>`;
    document.getElementById("question").value="";
  });
}
</script>

</head>

<body>

<h2>🔍 Buscador de notas</h2>

<input id="searchq" placeholder="Buscar texto...">

<select id="year">
  <option value="">Año</option>
  <option>2026</option>
  <option>2025</option>
  <option>2024</option>
  <option>2023</option>
</select>

<select id="tipo" onchange="toggleSeccion()">
  <option value="">Tipo</option>
  <option>Artículo</option>
  <option>Búsqueda de personal</option>
  <option>Capacitaciones</option>
  <option>Videos</option>
</select>

<select id="seccion" style="display:none">
  <option value="">Sección</option>
  <option>Avisos Generales</option>
  <option>Gestión</option>
  <option>Justicia Solidaria</option>
  <option>Beneficios y Becas</option>
  <option>Torneos y Concursos</option>
  <option>Especiales</option>
</select>

<button onclick="search()">Buscar</button>

<div id="results"></div>

<hr>

<h2>💬 Chatbot</h2>

<input id="question" placeholder="Escribí tu pregunta..." style="width:70%">
<button onclick="ask()">Enviar</button>

<div id="chat"></div>

</body>
</html>
