<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Chatbot Intranet</title>

  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }

    h2 { margin-top: 30px; }

    #searchBox { margin-bottom: 15px; }
    #results { border: 1px solid #ccc; padding: 10px; max-height: 300px; overflow-y: auto; }

    .result { margin-bottom: 10px; }
    .result a { text-decoration: none; color: #0645ad; }

    #chat { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin-top: 10px; }

    .user { color: #006; margin-top: 10px; }
    .bot { color: #060; margin-top: 10px; }

    .typing { font-style: italic; color: #999; }

    .feedback { margin-top: 8px; font-size: 14px; }
    .stars span { cursor: pointer; font-size: 18px; }

  </style>
</head>
<body>

<h2>🔍 Buscador de notas</h2>

<div id="searchBox">
  <input id="searchInput" type="text" placeholder="Buscar palabras..." style="width:50%" />

  <select id="yearFilter">
    <option value="">Todos los años</option>
  </select>

  <button onclick="runSearch()">Buscar</button>
</div>

<div id="results"></div>

<hr>

<h2>💬 Chat Intranet</h2>

<div id="chat"></div>

<input id="msg" type="text" style="width:80%" placeholder="Escribí tu pregunta..." />
<button onclick="send()">Enviar</button>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("msg");
const resultsBox = document.getElementById("results");
const yearFilter = document.getElementById("yearFilter");

let DATA = [];

// --------------------
// LOAD DATA FOR SEARCH
// --------------------

fetch("/data")
  .then(r => r.json())
  .then(data => {
    DATA = data;
    buildYearFilter();
  });

function buildYearFilter(){
  const years = [...new Set(DATA.map(d => d.anio).filter(Boolean))].sort((a,b)=>b-a);
  years.forEach(y=>{
    const o = document.createElement("option");
    o.value = y;
    o.textContent = y;
    yearFilter.appendChild(o);
  });
}

// --------------------
// SEARCH
// --------------------

function runSearch(){
  const q = document.getElementById("searchInput").value.toLowerCase();
  const year = yearFilter.value;

  resultsBox.innerHTML = "";

  let res = DATA.filter(d=>{
    const text = ((d.titulo||"") + " " + (d.texto||"")).toLowerCase();
    if(q && !text.includes(q)) return false;
    if(year && String(d.anio) !== year) return false;
    return true;
  });

  if(!res.length){
    resultsBox.innerHTML = "<i>No hay resultados</i>";
    return;
  }

  res.slice(0,100).forEach(d=>{
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = `
      <b>${d.fecha || ""}</b> — ${d.titulo || ""}<br>
      <a href="${d.url}" target="_blank">Ver nota</a>
    `;
    resultsBox.appendChild(div);
  });
}

// --------------------
// CHAT
// --------------------

function add(text, cls){
  const d = document.createElement("div");
  d.className = cls;
  d.innerHTML = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function send(){
  const text = input.value.trim();
  if(!text) return;

  add("👤 " + text, "user");
  input.value = "";

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "🤖 escribiendo...";
  chat.appendChild(typing);

  fetch("/chat",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ question: text })
  })
  .then(r => r.json())
  .then(data => {
    typing.remove();
    add("🤖 " + (data.answer || "Sin respuesta"), "bot");
  })
  .catch(err => {
    console.error(err);
    typing.remove();
    add("❌ Error al consultar el servidor", "bot");
  });
}

input.addEventListener("keydown", e=>{
  if(e.key === "Enter") send();
});
</script>

</body>
</html>
