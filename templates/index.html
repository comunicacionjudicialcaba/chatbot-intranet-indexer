<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Chatbot Intranet</title>

<style>
body{
  margin:0;
  font-family: "Segoe UI", Arial, sans-serif;
  background:#f2f4f8;
}

h2{ margin:0 0 8px 0; font-size:18px }

#layout{
  display:grid;
  grid-template-columns: 38% 62%;
  gap:15px;
  padding:15px;
  height:100vh;
  box-sizing:border-box;
}

/* -------- PANELS -------- */

.panel{
  background:#fff;
  border-radius:14px;
  padding:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  display:flex;
  flex-direction:column;
  height:100%;
}

/* -------- SEARCH -------- */

#results{
  margin-top:10px;
  overflow:auto;
  flex:1;
  border-top:1px solid #eee;
  padding-top:8px;
}


.resultItem{
  margin-bottom:10px;
  padding-bottom:8px;
  border-bottom:1px dashed #ddd;
}

/* -------- CHAT -------- */

#chat{
  flex:1;
  overflow:auto;
  padding:10px;
  background:#f7f9fc;
  border-radius:10px;
}

.msg{
  display:flex;
  margin:10px 0;
  align-items:flex-start;
}

.msg.user{ justify-content:flex-end; }

.bubble{
  max-width:70%;
  padding:10px 12px;
  border-radius:14px;
  line-height:1.35;
  font-size:14px;
}

.user .bubble{
  background:#dbe8ff;
  border-bottom-right-radius:4px;
}

.bot .bubble{
  background:#ffffff;
  border-bottom-left-radius:4px;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#ccc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  margin:0 8px;
}

.user .avatar{ background:#4a7cff; color:white }
.bot .avatar{ background:#00a6a6; color:white }

.botActions{
  margin-top:6px;
}

.botActions button{
  font-size:12px;
  margin-right:6px;
}

/* -------- INPUT -------- */

#typing{
  font-style:italic;
  color:#888;
  padding:5px 10px;
}

#inputRow{
  display:flex;
  gap:8px;
  margin-top:8px;
}

/* -------- FEEDBACK -------- */

.star{ cursor:pointer; font-size:18px; color:#ccc }
.star.selected{ color:gold }

.feedbackBox{
  margin-top:6px;
  background:#f1f3f8;
  padding:6px;
  border-radius:8px;
}

/* -------- MOBILE -------- */

@media(max-width:900px){
  #layout{ grid-template-columns:1fr; height:auto }
}
</style>
</head>

<body>

<div id="layout">

<!-- ================= SEARCH ================= -->
<div class="panel">

<h2>🔍 Buscador de notas</h2>

<div>
  <input id="searchText" placeholder="Buscar por palabra…" style="width:60%">
  <select id="yearFilter"><option value="">Todos los años</option></select>
  <button onclick="runSearch()">Buscar</button>
</div>

<div id="results"></div>

</div>

<!-- ================= CHAT ================= -->
<div class="panel">

<h2>💬 Chat Intranet</h2>

<div id="chat"></div>
<div id="typing" style="display:none;">🤖 Escribiendo…</div>

<div id="inputRow">
  <input id="msg" style="flex:1" placeholder="Escribí tu pregunta…" />
  <button onclick="send()">Enviar</button>
</div>

</div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("msg");
const typing = document.getElementById("typing");
const resultsBox = document.getElementById("results");
const yearFilter = document.getElementById("yearFilter");

let ALL_DATA = [];

/* ===== LOAD DATA ===== */
fetch("/data")
.then(r=>r.json())
.then(data=>{
  ALL_DATA=data;
  const years=[...new Set(data.map(d=>d.anio).filter(Boolean))].sort((a,b)=>b-a);
  years.forEach(y=>{
    const o=document.createElement("option");
    o.value=y; o.textContent=y;
    yearFilter.appendChild(o);
  });
});

/* ===== SEARCH ===== */
function runSearch(){
  const q=document.getElementById("searchText").value.toLowerCase();
  const year=yearFilter.value;
  resultsBox.innerHTML="";

let res = ALL_DATA.filter(d=>{
  if(year && String(d.anio)!==year) return false;
  const t=(d.titulo+" "+d.texto).toLowerCase();
  return q && t.includes(q);
});

/* ordenar por fecha más reciente */
res.sort((a,b)=>{
  if(!a.fecha_iso || !b.fecha_iso) return 0;
  return b.fecha_iso.localeCompare(a.fecha_iso);
});


  if(!res.length){
    resultsBox.innerHTML="<i>No hay resultados</i>";
    return;
  }

  res.slice(0,50).forEach(d=>{
    const div=document.createElement("div");
    div.className="resultItem";
    div.innerHTML=`
      <b>${d.titulo}</b><br>
      ${d.fecha||""}<br>
      <a href="${d.url}" target="_blank">Abrir nota</a>
    `;
    resultsBox.appendChild(div);
  });
}

/* ===== CHAT UI ===== */
function addUser(text){
  const row=document.createElement("div");
  row.className="msg user";
  row.innerHTML=`
    <div class="bubble">${text}</div>
    <div class="avatar">👤</div>
  `;
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
}

function addBot(html, question){
  const row=document.createElement("div");
  row.className="msg bot";

  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.innerHTML=html;

  const actions=document.createElement("div");
  actions.className="botActions";

  const copyBtn=document.createElement("button");
  copyBtn.textContent="📋 Copiar";
  copyBtn.onclick=()=>copyFormatted(bubble);

  const fb=buildFeedback(question, bubble.innerText);

  actions.appendChild(copyBtn);
  actions.appendChild(fb);

  const wrap=document.createElement("div");
  wrap.appendChild(bubble);
  wrap.appendChild(actions);

  row.innerHTML=`<div class="avatar">🤖</div>`;
  row.appendChild(wrap);

  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
}

/* ===== COPY ===== */
function copyFormatted(el){
  const c=el.cloneNode(true);
  c.querySelectorAll("a").forEach(a=>{
    a.replaceWith(`${a.textContent}: ${a.href}`);
  });
  navigator.clipboard.writeText(c.innerText).then(()=>alert("Copiado"));
}

/* ===== FEEDBACK ===== */
function buildFeedback(question, answer){
  const box=document.createElement("div");
  box.className="feedbackBox";

  let rating=0;
  const stars=document.createElement("div");

  for(let i=1;i<=5;i++){
    const s=document.createElement("span");
    s.textContent="★";
    s.className="star";
    s.onclick=()=>{
      rating=i;
      stars.querySelectorAll(".star").forEach((x,j)=>{
        x.classList.toggle("selected", j<i);
      });
    };
    stars.appendChild(s);
  }

  const txt=document.createElement("textarea");
  txt.placeholder="Comentario (opcional)";
  txt.style.width="100%";

  const btn=document.createElement("button");
  btn.textContent="Enviar feedback";
  btn.onclick=()=>{
    fetch("/feedback",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({question,answer,rating,comment:txt.value})
    }).then(()=>btn.textContent="Gracias 🙌");
  };

  box.append("Valoración: ",stars,document.createElement("br"),txt,btn);
  return box;
}

/* ===== CHAT BACKEND ===== */
function send(){
  const text=input.value.trim();
  if(!text) return;

  addUser(text);
  input.value="";
  typing.style.display="block";

  fetch("/chat",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({question:text})
  })
  .then(r=>r.json())
  .then(d=>{
    typing.style.display="none";
    addBot(d.answer||"Sin respuesta", text);
  })
  .catch(()=>{
    typing.style.display="none";
    addBot("❌ Error de servidor", text);
  });
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});
</script>

</body>
</html>
