<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Asistente Intranet Judicial</title>

<style>
:root{
  --bg-main:#eef2f7;
  --card:#ffffffee;
  --primary:#1f3a5f;
  --secondary:#3b82f6;
  --bot:#f1f5f9;
  --user:#dbeafe;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  background:
    linear-gradient(rgba(238,242,247,.92), rgba(238,242,247,.92)),
    url("https://images.unsplash.com/photo-1528747008803-1f08b1c1a8b6?auto=format&fit=crop&w=1600&q=60");
  background-size:cover;
  background-position:center;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Card principal */
.app{
  width:100%;
  max-width:900px;
  height:90vh;
  background:var(--card);
  border-radius:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* Header */
.header{
  background:linear-gradient(135deg,#1f3a5f,#2c5282);
  color:white;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:12px;
}

.header .logo{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#fff2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.header h1{
  font-size:16px;
  margin:0;
  font-weight:600;
}

.header small{
  display:block;
  font-size:12px;
  opacity:.85;
}

/* Chat */
#chat{
  flex:1;
  padding:18px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* Burbujas */
.msg{
  max-width:75%;
  padding:10px 14px;
  border-radius:14px;
  line-height:1.4;
  font-size:14px;
  box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.user{
  align-self:flex-end;
  background:var(--user);
  border-bottom-right-radius:4px;
}

.bot{
  align-self:flex-start;
  background:var(--bot);
  border-bottom-left-radius:4px;
}

/* Input */
.input-area{
  display:flex;
  gap:10px;
  padding:14px;
  border-top:1px solid #e5e7eb;
  background:white;
}

.input-area input{
  flex:1;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #cbd5e1;
  font-size:14px;
}

.input-area input:focus{
  outline:none;
  border-color:var(--secondary);
}
